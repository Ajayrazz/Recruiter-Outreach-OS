<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block}
#fallback{position:absolute;right:12%;top:30%;width:120px;height:120px;transform-style:preserve-3d;animation:spin 9s linear infinite;display:none}
#fallback i{position:absolute;inset:0;border:2px solid #8b7cf6;border-radius:14px;background:rgba(139,124,246,.12)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}

body{font-family:"Plus Jakarta Sans",Inter,-apple-system,sans-serif;color:#ececf3;background:radial-gradient(520px 240px at 78% 45%,rgba(124,92,246,.38),transparent 70%),linear-gradient(180deg,#14141b,#0d0d12);border-radius:22px}
#txt{position:absolute;left:34px;top:50%;transform:translateY(-50%);max-width:52%;z-index:2}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:12px;color:#cfcfe0;margin-bottom:14px}
h2{font-size:34px;line-height:1.12;margin:0 0 10px;letter-spacing:-.03em;font-weight:700}
h2 em{font-family:Georgia,serif;font-weight:500;background:linear-gradient(90deg,#c4b5fd,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#9a9aab;margin:0;font-size:14.5px}
@media(max-width:700px){#txt{max-width:92%}h2{font-size:26px}}
</style></head><body><div id="txt"><span class="pill">__PILL__</span><h2>__TITLE__<br><em>__ACCENT__</em></h2><p>__SUB__</p></div><div id="fallback"><i></i><i style="transform:rotateY(90deg)"></i><i style="transform:rotateX(90deg)"></i></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
 if(typeof THREE==="undefined"){document.getElementById("fallback").style.display="block";return;}
 var W=innerWidth,H=innerHeight,s=new THREE.Scene(),c=new THREE.PerspectiveCamera(45,W/H,.1,100);c.position.set(0,0,11);
 var r=new THREE.WebGLRenderer({alpha:true,antialias:true});r.setSize(W,H);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
 s.add(new THREE.AmbientLight(0x8877ff,.9));var d=new THREE.DirectionalLight(0xffffff,1.1);d.position.set(5,6,8);s.add(d);
 var p=new THREE.PointLight(0xa78bfa,2,30);p.position.set(-4,-2,5);s.add(p);
 var g=new THREE.Group();g.position.x=W>700?3.6:0;s.add(g);
 // three-cube cluster (isometric, like the Mock Test icon) + wireframe shells
 var geo=new THREE.BoxGeometry(1.5,1.5,1.5),mat=new THREE.MeshStandardMaterial({color:0x7c6cf0,metalness:.35,roughness:.28,emissive:0x2a2170,emissiveIntensity:.6});
 var pos=[[0,1.3,0],[-1.3,-.4,0],[1.3,-.4,0]],cubes=[];
 pos.forEach(function(q,i){var m=new THREE.Mesh(geo,mat);m.position.set(q[0],q[1],0);g.add(m);cubes.push(m);
   var w=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.9,1.9,1.9)),new THREE.LineBasicMaterial({color:0xc4b5fd,transparent:true,opacity:.35}));w.position.copy(m.position);g.add(w);cubes.push(w);});
 var ring=new THREE.Mesh(new THREE.TorusGeometry(3.3,.012,8,160),new THREE.MeshBasicMaterial({color:0xa78bfa,transparent:true,opacity:.5}));ring.rotation.x=1.2;g.add(ring);
 var ring2=ring.clone();ring2.scale.set(1.25,1.25,1.25);ring2.rotation.set(.4,.8,0);ring2.material=ring.material.clone();ring2.material.opacity=.22;g.add(ring2);
 // particle field
 var N=260,pg=new THREE.BufferGeometry(),pa=new Float32Array(N*3);for(var i=0;i<N*3;i++)pa[i]=(Math.random()-.5)*16;
 pg.setAttribute("position",new THREE.BufferAttribute(pa,3));
 var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xc4b5fd,size:.045,transparent:true,opacity:.8}));s.add(pts);
 var mx=0,my=0;addEventListener("mousemove",function(e){mx=(e.clientX/W-.5);my=(e.clientY/H-.5);});
 var t=0,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
 function loop(){requestAnimationFrame(loop);if(!still)t+=.012;
  g.rotation.y+=(t*.6+mx*1.2-g.rotation.y)*.05;g.rotation.x+=(my*.6-g.rotation.x)*.05;g.position.y=Math.sin(t*1.4)*.25;
  cubes.forEach(function(m,i){m.rotation.y=Math.sin(t+i)*.15;});ring.rotation.z=t*.5;ring2.rotation.y=t*.35;pts.rotation.y=t*.08;pts.rotation.x=t*.03;r.render(s,c);}
 loop();
 addEventListener("resize",function(){W=innerWidth;H=innerHeight;c.aspect=W/H;c.updateProjectionMatrix();r.setSize(W,H);g.position.x=W>700?3.6:0;});
})();
</script></body></html>
